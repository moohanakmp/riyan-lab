name: Build and deploy Riyan Lab
on:
  push:
    branches: [main, 'staging/backend-auth-20261016']
  pull_request:
    branches: [main, 'staging/backend-auth-20261016']
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/neondb
      DB_SCHEMA: riyan_lab_staging
      APP_ENV: staging
      DB_USER: postgres
      DB_PASSWORD: postgres
      RIYAN_BOOTSTRAP_ADMIN_USER: testadmin
      RIYAN_BOOTSTRAP_ADMIN_PASSWORD: unit-test-password-1234
      RIYAN_INTEGRATION_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test backend
        run: mvn -B verify
      - name: Check frontend syntax
        run: node scripts/check-frontend.cjs
      - name: Check sync IDs and Low Profit fallback
        run: node scripts/check-sync-scalp.cjs
      - name: Verify paper basket and replay
        run: |
          node --check src/main/resources/static/basket-demo.js
          node --check src/main/resources/static/basket-replay.js
          node scripts/check-basket.cjs
          node scripts/check-trading.cjs
          node scripts/check-btc-feed.cjs
          node scripts/check-reference-feed.cjs
          node scripts/check-public-market-fetch.cjs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deployment skipped: RENDER_DEPLOY_HOOK secret not configured."
            exit 0
          fi
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
