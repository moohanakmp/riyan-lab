name: Build and deploy Riyan Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/neondb
      DB_USER: postgres
      DB_PASSWORD: postgres
      RIYAN_BOOTSTRAP_ADMIN_USER: testadmin
      RIYAN_BOOTSTRAP_ADMIN_PASSWORD: unit-test-password-1234
      RIYAN_INTEGRATION_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test backend
        run: mvn -B verify
      - name: Check frontend syntax
        run: node scripts/check-frontend.cjs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deployment skipped: RENDER_DEPLOY_HOOK secret not configured."
            exit 0
          fi
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
