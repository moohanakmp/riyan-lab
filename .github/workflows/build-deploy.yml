name: Build and deploy Riyan Lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test backend
        run: mvn -B verify
      - name: Check frontend syntax
        run: node scripts/check-frontend.cjs
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK: \${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Render deployment skipped: RENDER_DEPLOY_HOOK secret not configured."
            exit 0
          fi
          curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
