# Keeps the free Render staging service awake during weekday market hours so the
# server news poll and background paper scanner keep running. Approved by the owner
# 2026-11-14 ("awake in market hours only"). 06:00–21:00 UTC = 11:30–02:30 IST,
# Monday–Friday (~330 of Render's 750 free instance hours a month).
# Render free sleeps after 15 idle minutes, so ping every 5 minutes: GitHub can delay
# scheduled runs by several minutes.
name: Keep staging awake in market hours
on:
  schedule:
    - cron: '2-59/5 6-20 * * 1-5'
  workflow_dispatch:
permissions: {}
concurrency:
  group: staging-background-wake
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake staging service and check health
        run: |
          curl --fail --silent --show-error --max-time 110 --retry 1 --retry-delay 5 \
            https://riyan-lab-staging.onrender.com/api/v1/health
