server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.flyway.default-schema=${DB_SCHEMA:riyan_lab}
spring.flyway.schemas=${DB_SCHEMA:riyan_lab}
spring.flyway.create-schemas=true
server.error.include-message=never

# Respect Render HTTPS forwarding so session cookies are marked Secure.
server.forward-headers-strategy=framework

# Each JDBC connection uses the schema selected by DB_SCHEMA.
spring.datasource.hikari.schema=${DB_SCHEMA:riyan_lab}

# News polling and signal scanning must not block one another.
spring.task.scheduling.pool.size=2
app.background.enabled=${BACKGROUND_SCANNER_ENABLED:true}
