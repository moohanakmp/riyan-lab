server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.flyway.default-schema=riyan_lab
spring.flyway.schemas=riyan_lab
spring.flyway.create-schemas=true
server.error.include-message=never
\n# Respect Render HTTPS forwarding so session cookies are marked Secure.\nserver.forward-headers-strategy=framework\n