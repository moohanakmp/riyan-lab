services:
  - type: web
    name: riyan-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: riyan_lab
      - key: APP_ENV
        value: production
      - key: RIYAN_BOOTSTRAP_ADMIN_USER
        sync: false
      - key: RIYAN_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
